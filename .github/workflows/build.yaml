name: Build pycdc for Windows, Linux, and macOS
on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.14.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: windows-x86_64, target: x86_64-windows-gnu, system: Windows, os: windows, arch: x86_64,  exe: .exe }
          - { name: linux-x86_64,   target: x86_64-linux-musl,  system: Linux,   os: linux,   arch: x86_64,  exe: "" }
          - { name: linux-aarch64,  target: aarch64-linux-musl, system: Linux,   os: linux,   arch: aarch64, exe: "" }
          - { name: macos-aarch64,  target: aarch64-macos-none, system: Darwin,  os: macos,   arch: aarch64, exe: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zrax/pycdc
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.target }}

      - name: Compile
        env:
          CC: "zig cc"
          CXX: "zig c++"
        shell: bash
        run: |
          printf '#!/bin/sh\nexec zig ar "$@"\n'     > zig-ar
          printf '#!/bin/sh\nexec zig ranlib "$@"\n' > zig-ranlib
          chmod +x zig-ar zig-ranlib
          cmake -B build -G Ninja -DCMAKE_SYSTEM_NAME=${{ matrix.system }} \
            -DCMAKE_C_COMPILER_TARGET=${{ matrix.target }} \
            -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.target }} \
            -DCMAKE_AR="$PWD/zig-ar" -DCMAKE_RANLIB="$PWD/zig-ranlib" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          install -Dm755 build/pycdc${{ matrix.exe }}  "dist/pycdc-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.exe }}"
          install -Dm755 build/pycdas${{ matrix.exe }} "dist/pycdas-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.exe }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - run: git clone --depth=1 https://github.com/zrax/pycdc
      - name: Copy to dist
        run: |
          mkdir dist
          mv windows-x86_64/* linux-x86_64/* linux-aarch64/* macos-aarch64/* dist/

      - name: Set release metadata
        run: |
          echo "REV=$(git -C pycdc rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "DATE=$(date -u +%d-%b-%Y)" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="build-${{ env.DATE }}-${{ env.REV }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" -t "Decompyle++ ${{ env.DATE }}" \
              -n "Compiled on ${{ env.DATE }} GMT, pycdc commit ${{ env.REV }}" \
              -d dist/*
          fi
